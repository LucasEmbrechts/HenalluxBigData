# Kit Spark — un petit cluster Spark, SANS Hadoop.
# Version figee volontairement : ne pas utiliser :latest
#
# Spark fournit son propre gestionnaire de cluster, appele "Standalone" :
#   spark-master    distribue le travail (il ne calcule pas)
#   spark-worker-1  calcule
#   spark-worker-2  calcule
#   spark-client    la machine d'ou l'on soumet les jobs (elle ne calcule pas)

services:

  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"     # interface web du cluster

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "1"        # ce que ce worker offre au cluster
      SPARK_WORKER_MEMORY: "1g"
    volumes:
      - ./data:/data                 # les donnees (voir README, section 2)
    depends_on:
      - spark-master

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: "1g"
    volumes:
      - ./data:/data
    depends_on:
      - spark-master

  spark-client:
    image: apache/spark:3.5.1
    container_name: spark-client
    hostname: spark-client
    command: ["tail", "-f", "/dev/null"]   # conteneur qui reste vivant
    environment:
      # spark-submit utilisable sans chemin complet
      PATH: "/opt/spark/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    ports:
      - "4040:4040"     # interface de l'application Spark en cours
    volumes:
      - ./data:/data    # les donnees
      - ./job:/job      # le code du job
      - ./conf:/opt/spark/conf:ro   # moins de messages a l'ecran
    depends_on:
      - spark-master
