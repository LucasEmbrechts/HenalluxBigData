# Kit Spark — Spark en Python, sur une seule machine.
# Version figee volontairement : ne pas utiliser :latest
#
# Un seul conteneur : on y lance des programmes Spark ecrits en Python.
# Le but de ce kit est d'apprendre a ECRIRE du Spark. Le calcul reparti sur
# plusieurs machines est montre dans le kit kits/hadoop/spark.

services:

  spark:
    image: apache/spark:3.5.9
    container_name: spark
    hostname: spark
    command: ["tail", "-f", "/dev/null"]
    environment:
      PATH: "/opt/spark/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - ./data:/data
      - ./job:/job
      - ./exercices:/exercices
      - ./sortie:/sortie
      - ./conf:/opt/spark/conf:ro
