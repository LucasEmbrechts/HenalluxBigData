services:

  namenode:
    image: apache/hadoop:3.4.0
    hostname: namenode
    container_name: namenode
    user: root
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"      # interface web HDFS
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    volumes:
      - ./data:/data     # jeux de donnees fournis

  datanode:
    image: apache/hadoop:3.4.0
    container_name: datanode
    user: root
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    depends_on:
      - namenode

  spark-master:
    image: apache/spark:3.5.1
    hostname: spark-master
    container_name: spark-master
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"      # interface web du master Spark
      - "7077:7077"      # port de soumission
      - "4040:4040"      # interface de l'application en cours
    depends_on:
      - namenode

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "2g"
    ports:
      - "8081:8081"      # interface web du worker
    depends_on:
      - spark-master
