# Cluster Hadoop minimal pour manipuler MapReduce
# Image officielle Apache (https://hub.docker.com/r/apache/hadoop)
# Version figée volontairement : ne pas utiliser :latest

services:

  namenode:
    image: apache/hadoop:3.4.0
    hostname: namenode
    container_name: namenode
    user: root
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"     # interface web HDFS
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    volumes:
      - ./data:/data                 # jeux de données fournis
      # On monte ./job en entier, pas ./job/target : « mvn clean » supprime et
      # recrée target/, ce qui casserait le montage jusqu'au redémarrage.
      - ./job:/job                   # le code source et le .jar compilé

  datanode:
    image: apache/hadoop:3.4.0
    container_name: datanode
    user: root
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    depends_on:
      - namenode

  resourcemanager:
    image: apache/hadoop:3.4.0
    hostname: resourcemanager
    container_name: resourcemanager
    user: root
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"     # interface web YARN (suivi des jobs)
    env_file:
      - ./config
    volumes:
      - ./data:/data
      - ./job:/job
    depends_on:
      - namenode

  nodemanager:
    image: apache/hadoop:3.4.0
    container_name: nodemanager
    user: root
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config
    depends_on:
      - resourcemanager
