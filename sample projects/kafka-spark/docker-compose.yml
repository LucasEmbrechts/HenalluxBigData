# Projet d'exemple : Kafka -> Spark Structured Streaming
# Source de donnees utilisee ici : le flux en direct de Wikipedia.
# Versions figees volontairement : ne pas utiliser :latest
#
#   producteur.py  lit le flux Wikipedia et l'envoie dans Kafka
#   comptage.py    un job Spark qui lit Kafka et calcule en continu
#
# Kafka : meme configuration que le kit kits/streaming/kafka.
# Spark : meme version que le kit kits/spark, mais en mode local
# (une seule machine, sans master ni workers) pour rester simple.

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"     # port client
    environment:
      # Les commandes Kafka (kafka-topics.sh...) sont utilisables sans chemin complet
      PATH: "/opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

      # Un seul noeud, qui fait tout. Pas de ZooKeeper (mode "KRaft").
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "EXTERNE://:9092,INTERNE://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNE://localhost:9092,INTERNE://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNE:PLAINTEXT,INTERNE:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNE"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      # Un seul serveur : une seule copie de chaque donnee, y compris pour les
      # topics internes de Kafka.
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"

      # On cree toujours les topics nous-memes : un nom mal orthographie ne
      # doit pas creer un topic en silence.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Le flux Wikipedia produit environ 1 Mo par minute. Les messages sont
      # supprimes apres 24 h (7 jours par defaut) pour ne pas remplir le disque.
      KAFKA_LOG_RETENTION_HOURS: "24"
      # Par defaut, un groupe de consommateurs attend 3 s avant de demarrer.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"   # sans cela, Kafka reclame 1 Go
    volumes:
      - kafka-data:/var/lib/kafka/data  # les messages

  # Le producteur Python. Il ne demarre PAS avec "docker compose up" :
  # on le lance a la main avec "docker compose run --rm producteur".
  producteur:
    build: ./producteur
    image: henallux/kafka-spark-producteur:1.0
    profiles: ["programmes"]
    command: ["python", "producteur.py"]
    init: true          # pour que Ctrl+C arrete le programme proprement
    environment:
      KAFKA: "kafka:19092"
    volumes:
      - ./producteur:/programmes
    depends_on:
      - kafka

  # Le job Spark. Lui non plus ne demarre pas tout seul :
  # on le lance a la main avec "docker compose run --rm spark".
  spark:
    build: ./spark
    image: henallux/kafka-spark:3.5.1
    profiles: ["programmes"]
    # local[2] : Spark tourne dans ce seul conteneur, avec 2 coeurs.
    command: ["/opt/spark/bin/spark-submit", "--master", "local[2]", "--driver-memory", "1g", "/job/comptage.py"]
    init: true
    environment:
      KAFKA: "kafka:19092"
    volumes:
      - ./spark:/job
    depends_on:
      - kafka

volumes:
  kafka-data:
